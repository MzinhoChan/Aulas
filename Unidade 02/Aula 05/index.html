<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>PRODUTO</th>
                <th>QUANTIDADE</th>
                <th>FRETE</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Camiseta</td>
                <td>2</td>
                <td>R$ 9,99</td>
            </tr>
            <tr>
                <td>Sapato</td>
                <td>1</td>
                <td>R$ 13,00</td>
            <tr>
                <td>Boné</td>
                <td>3</td>
                <td>R$ 0,00</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Total</td>
                <td></td>
                <td>R$ 22,99</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
